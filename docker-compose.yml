services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: processlens-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-processlens}
      POSTGRES_USER: ${POSTGRES_USER:-processlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-processlens}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-processlens} -d ${POSTGRES_DB:-processlens}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
